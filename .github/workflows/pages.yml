# Builds the static reader-facing site and publishes it to GitHub Pages.
#
# A GitHub runner has no access to the SQLite database on your machine, so the
# flow is: edit locally -> Publish content -> npm run snapshot -> commit -> push.
# See README.md.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No database on the runner: the export uses content/published.json,
      # which `npm run snapshot` writes from your local Publish.
      - run: npm run export
        env:
          # Must match the repository name for a project site.
          NEXT_PUBLIC_BASE_PATH: /25851357
          # Optional: the origin of your deployed editor, so the footer's
          # "Owner access" link works from the published site.
          EDITOR_ORIGIN: ${{ vars.EDITOR_ORIGIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
